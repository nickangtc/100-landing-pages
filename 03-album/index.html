<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album — Social media for your inner circle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap"
    rel="stylesheet">
  <!-- Prefetch all hero images -->
  <link rel="preload" as="image" href="inner_circle.jpg">
  <link rel="preload" as="image" href="sovereign_individual.jpg">
  <link rel="preload" as="image" href="supposed_to_be.jpg">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #faf9f7;
      --text: #1a1a18;
      --text-secondary: #4a4a46;
      --accent: #1a1a18;
      --border: #d4d2cd;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #000;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Stacked background slides */
    .bg-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.2s ease;
      z-index: 0;
    }

    .bg-slide.active {
      opacity: 1;
    }

    .bg-slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right,
          rgba(0, 0, 0, 0.7) 0%,
          rgba(0, 0, 0, 0.55) 25%,
          rgba(0, 0, 0, 0.3) 40%,
          rgba(0, 0, 0, 0) 55%);
    }

    nav,
    .hero,
    .wordmark {
      position: relative;
      z-index: 1;
    }

    /* Nav */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.5vh 4vw;
    }

    .nav-logo {
      font-size: 2vh;
      line-height: 1;
      cursor: default;
      user-select: none;
      filter: brightness(0) invert(1);
    }

    .nav-links {
      display: flex;
      align-items: center;
      background: #fff;
      border-radius: 6px;
      padding: 0.5vh 0.5vh 0.5vh 2vw;
      gap: 1.5vw;
    }

    .nav-links a {
      text-decoration: none;
      color: #1a1a18;
      font-size: 1.8vh;
      font-weight: 400;
      letter-spacing: -0.01em;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.6;
    }

    .btn-nav {
      background: #2a2a28;
      color: #fff;
      padding: 1vh 2vw;
      font-size: 1.8vh;
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: opacity 0.2s ease;
    }

    .btn-nav:hover {
      opacity: 0.85;
    }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 4vw;
    }

    .hero h1 {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 5.5vh;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #fff;
      max-width: 33vw;
      margin-bottom: 2.5vh;
    }

    .hero p {
      font-size: 2vh;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      max-width: 33vw;
      margin-bottom: 3.5vh;
    }

    /* CTA Button */
    .btn-cta {
      display: inline-flex;
      align-items: center;
      gap: 1.5vw;
      background: #fff;
      border: 1.5px solid #fff;
      border-radius: 6px;
      padding: 1.2vh 2vw;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.8vh;
      font-weight: 500;
      color: #1a1a18;
      cursor: pointer;
      transition: opacity 0.25s ease;
      text-decoration: none;
      letter-spacing: -0.01em;
      width: fit-content;
    }

    .btn-cta:hover {
      opacity: 0.9;
    }

    .btn-cta .dot {
      width: 1vh;
      height: 1vh;
      background: #1a1a18;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .btn-cta .arrow {
      font-size: 2vh;
      color: #1a1a18;
      transition: transform 0.25s ease;
    }

    .btn-cta:hover .arrow {
      transform: translateX(3px);
    }

    /* Wordmark */
    .wordmark {
      padding: 0 4vw 3vh;
    }

    .wordmark span {
      font-family: 'DM Sans', sans-serif;
      font-size: 26vh;
      font-weight: 300;
      letter-spacing: -0.04em;
      line-height: 0.8;
      color: #fff;
      display: block;
      user-select: none;
    }

    /* Waitlist Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 24, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--bg);
      border-radius: 6px;
      padding: clamp(2rem, 4vw, 3rem);
      max-width: 28rem;
      width: calc(100% - 2rem);
      transform: translateY(8px);
      transition: transform 0.3s ease;
      position: relative;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal h2 {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .modal p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .modal form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .modal input[type="email"] {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .modal input[type="email"]::placeholder {
      color: #a0a09a;
    }

    .modal input[type="email"]:focus {
      border-color: var(--text);
    }

    .modal button[type="submit"] {
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.85rem 1rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s ease;
      letter-spacing: -0.01em;
    }

    .modal button[type="submit"]:hover {
      opacity: 0.85;
    }

    .modal button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.25rem;
      line-height: 1;
    }

    .modal-error {
      color: #c44;
      font-size: 0.85rem;
      margin-top: -0.25rem;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .bg-slide {
        background-position: 60% center;
      }

      .bg-slide::after {
        background: linear-gradient(to right,
            rgba(0, 0, 0, 0.8) 0%,
            rgba(0, 0, 0, 0.6) 40%,
            rgba(0, 0, 0, 0.4) 70%,
            rgba(0, 0, 0, 0.2) 100%);
      }

      nav {
        padding: 16px 20px;
      }

      .nav-logo {
        font-size: 16px;
      }

      .nav-links {
        padding: 6px 6px 6px 16px;
        gap: 12px;
      }

      .nav-links a {
        font-size: 14px;
      }

      .btn-nav {
        padding: 8px 16px;
        font-size: 14px;
      }

      .hero {
        padding: 0 20px;
      }

      .hero h1 {
        font-size: 32px;
        max-width: 100%;
        margin-bottom: 16px;
      }

      .hero p {
        font-size: 15px;
        max-width: 100%;
        margin-bottom: 24px;
      }

      .btn-cta {
        padding: 12px 20px;
        font-size: 15px;
        gap: 12px;
      }

      .btn-cta .dot {
        width: 8px;
        height: 8px;
      }

      .btn-cta .arrow {
        font-size: 16px;
      }

      .wordmark {
        padding: 0 20px 16px;
      }

      .wordmark span {
        font-size: 18vw;
      }
    }
  </style>
</head>

<body>
  <!-- Background image slides -->
  <div class="bg-slide active" style="background-image: url('inner_circle.jpg')"></div>
  <div class="bg-slide" style="background-image: url('sovereign_individual.jpg')"></div>
  <div class="bg-slide" style="background-image: url('supposed_to_be.jpg')"></div>

  <nav>
    <div class="nav-logo">📖</div>
    <div class="nav-links">
      <a href="#about">About</a>
      <button class="btn-nav" data-open-modal>Join the Waitlist</button>
    </div>
  </nav>

  <main class="hero">
    <h1>Hate paying for social media with your attention, data, and privacy?</h1>
    <p>Album lets you upload original quality images and videos as Instagram-style posts for sharing with your inner circle.</p>
    <a href="#" class="btn-cta" data-open-modal>
      <span class="dot"></span>
      Join the Waitlist
      <span class="arrow">→</span>
    </a>
  </main>

  <div class="wordmark">
    <span>Album</span>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="modal-close" data-close-modal>&times;</button>
      <h2>Join the waitlist</h2>
      <p>Be the first to know when Album launches.</p>
      <form id="waitlist-form">
        <input type="email" placeholder="Your email" required>
        <button type="submit">Join the Waitlist</button>
      </form>
    </div>
  </div>

  <script>
    // Background slideshow — cycle every 5 seconds
    const slides = document.querySelectorAll('.bg-slide');
    let current = 0;
    const total = slides.length;

    function nextSlide() {
      const prev = current;
      current = (current + 1) % total;
      slides[prev].classList.remove('active');
      slides[current].classList.add('active');
    }

    setInterval(nextSlide, 5000);

    // Modal
    const modal = document.getElementById('modal');

    document.querySelectorAll('[data-open-modal]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        modal.classList.add('active');
        modal.querySelector('input').focus();
      });
    });

    document.querySelectorAll('[data-close-modal]').forEach(el => {
      el.addEventListener('click', () => modal.classList.remove('active'));
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.classList.remove('active');
    });

    document.getElementById('waitlist-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = e.target.querySelector('input');
      input.value = '';
      modal.querySelector('h2').textContent = 'You\'re on the list';
      modal.querySelector('p').textContent = 'We\'ll let you know when Album is ready.';
      e.target.style.display = 'none';
    });
  </script>
</body>

</html>
